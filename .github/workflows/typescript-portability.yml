name: TypeScript portability

on:
  pull_request:
    branches: [master]
    paths:
      - package.json
      - bun.lock
      - tsconfig.json
      - .github/workflows/typescript-portability.yml
  push:
    branches: [master]
    paths:
      - package.json
      - bun.lock
      - tsconfig.json
      - .github/workflows/typescript-portability.yml
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-portability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript 7 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install exactly from the lockfile
        run: bun install --frozen-lockfile

      - name: Verify the native TypeScript compiler
        run: >-
          bun -e 'const result = Bun.spawnSync(["bun", "x", "tsc", "--version"]);
          const version = new TextDecoder().decode(result.stdout).trim();
          if (result.exitCode !== 0 || version !== "Version 7.0.2") {
            console.error(version || new TextDecoder().decode(result.stderr));
            process.exit(1);
          }'

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
